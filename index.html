<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pokémon Name Trainer</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Added to the iOS home screen this opens full-screen, with its own storage
     container separate from Safari's. iOS 15+ takes the status bar colour from
     theme-color, so it follows the page's light/dark palette. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poké Names">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f1f5f9; --panel: #ffffff; --panel-2: #f8fafc;
    --ink: #0f172a; --ink-2: #475569; --ink-3: #94a3b8;
    --line: #e2e8f0; --accent: #4f46e5; --accent-ink: #ffffff;
    --good: #059669; --good-bg: #ecfdf5; --bad: #dc2626; --bad-bg: #fef2f2;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --panel: #151d2e; --panel-2: #1b2436;
      --ink: #e8edf7; --ink-2: #a3b0c7; --ink-3: #6b7a94;
      --line: #26314a; --accent: #7c83ff; --accent-ink: #0b1120;
      --good: #34d399; --good-bg: #08301f; --bad: #f87171; --bad-bg: #3a1116;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  /* Beats the display:flex rules below, which would otherwise win over [hidden]. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    min-height: 100%; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; margin-right: auto; }
  .brand span { color: var(--ink-3); font-weight: 500; }
  .icon-btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); width: 38px; height: 38px; border-radius: 11px; cursor: pointer;
    display: grid; place-items: center; font-size: 17px; flex: none;
  }
  .icon-btn:hover { border-color: var(--ink-3); }
  .icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .meter { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-2); }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .pill { padding: 2px 8px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .pill.retry { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }

  /* ---- card ---- */
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; min-height: 320px;
  }
  /* The slot holds the layout so a slow or failed image never shifts the card,
     and a muted Poké Ball shows through until the artwork paints. */
  .art-slot { position: relative; width: 100%; max-width: 280px; aspect-ratio: 1; display: grid; place-items: center; }
  .card.back .art-slot { max-width: 200px; margin-bottom: 2px; }
  .art-slot svg { width: 42%; color: var(--ink-3); opacity: .22; }
  .art-slot.loading svg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .12; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .art-slot.loading svg { animation: none; } }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .18s ease;
  }
  .art.ready { opacity: 1; }
  .name { font-size: clamp(26px, 8vw, 38px); font-weight: 750; letter-spacing: -.025em; line-height: 1.15; margin: 6px 0 2px; }
  .say { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .phon { color: var(--ink-2); font-size: 15px; font-style: italic; }
  .speak {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    border-radius: 99px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .speak:hover { border-color: var(--accent); color: var(--accent); }
  .speak.speaking { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .speak[disabled] { opacity: .5; cursor: not-allowed; }
  .facts { margin-top: 12px; color: var(--ink-3); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .facts b { font-weight: 600; color: var(--ink-2); }
  .hint { color: var(--ink-3); font-size: 13px; margin-top: 14px; }

  /* ---- actions ---- */
  .actions { display: grid; gap: 10px; }
  .actions.two { grid-template-columns: 1fr 1fr; }
  .actions.choices { grid-template-columns: 1fr; gap: 8px; }
  button.big {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 13px; padding: 15px 12px; font-size: 16px; font-weight: 650; cursor: pointer;
    font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  button.big small { font-weight: 500; font-size: 11px; color: var(--ink-3); }
  button.big:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary small { color: color-mix(in srgb, var(--accent-ink) 70%, transparent); }
  button.good { color: var(--good); background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  button.good small { color: color-mix(in srgb, var(--good) 70%, transparent); }
  button.bad { color: var(--bad); background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  button.bad small { color: color-mix(in srgb, var(--bad) 70%, transparent); }

  /* One choice per row — names run to 19 characters and must not truncate. */
  button.choice { position: relative; flex-direction: row; justify-content: center; gap: 9px; padding: 13px 12px; font-size: 15.5px; min-height: 44px; }
  /* Numbers pin to a tidy left column; symmetric padding keeps names centred. */
  button.choice:has(.n) { padding-left: 46px; padding-right: 46px; }
  button.choice .n {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 8px; line-height: 1.4;
  }
  /* A speaker can't nest inside the answer button, so each option becomes a row
     of two sibling buttons: answer on the left, "hear it" on the right. */
  .choice-row { display: flex; gap: 8px; }
  .choice-row button.choice { flex: 1; min-width: 0; }
  .speak-choice {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 13px; width: 58px; min-height: 44px; flex: none; cursor: pointer;
    font-size: 21px; display: grid; place-items: center; font-family: inherit;
  }
  .speak-choice:hover { border-color: var(--accent); }
  .speak-choice.speaking { background: var(--accent); border-color: var(--accent); }
  .speak-choice[disabled] { opacity: .4; cursor: not-allowed; }

  /* Easy mode is aimed at small hands: taller targets, bigger type, and more
     air between the rows, since an adjacent button is what a stray tap hits. */
  .actions.choices.roomy { gap: 14px; }
  .actions.choices.roomy button.choice { min-height: 76px; font-size: 21px; padding: 14px 12px; }
  .actions.choices.roomy button.choice:has(.n) { padding-left: 66px; padding-right: 66px; }
  .actions.choices.roomy button.choice .n {
    left: 14px; font-size: 21px; padding: 4px 13px; border-radius: 11px;
    color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .actions.choices.roomy .speak-choice { width: 74px; min-height: 76px; font-size: 27px; }
  .card.choosing.roomy .art-slot { max-width: 168px; }

  /* Wind it back where the screen cannot take it. */
  @media (max-height: 720px) {
    .actions.choices.roomy { gap: 11px; }
    .actions.choices.roomy button.choice { min-height: 64px; font-size: 19px; }
    .actions.choices.roomy .speak-choice { min-height: 64px; width: 66px; font-size: 24px; }
    .card.choosing.roomy .art-slot { max-width: 118px; }
  }
  /* Shortest phones: the prompt is text a pre-reader cannot use anyway, and the
     picture says the same thing, so it yields its space to the buttons. */
  @media (max-height: 600px) {
    .card.choosing.roomy { padding: 9px; }
    .card.choosing.roomy .hint { display: none; }
  }
  @media (max-width: 360px) {
    .actions.choices.roomy button.choice { font-size: 17px; }
    .actions.choices.roomy button.choice:has(.n) { padding-left: 54px; padding-right: 54px; }
    .actions.choices.roomy button.choice .n { font-size: 18px; left: 10px; padding: 3px 10px; }
    .actions.choices.roomy .speak-choice { width: 58px; }
  }
  /* Four stacked buttons need the room, so let the card give some back. The
     artwork stops deriving its height from its width here and simply takes what
     is left, letterboxing inside, so a short screen can never push a button off. */
  .card.choosing { min-height: 0; overflow: hidden; }
  .card.choosing .art-slot { aspect-ratio: auto; flex: 1 1 auto; min-height: 44px; }
  .card.choosing .art-slot { max-width: 190px; }
  .result { border-radius: 10px; padding: 7px 15px; font-weight: 700; font-size: 13.5px; margin-bottom: 10px; }
  .result.ok { background: var(--good-bg); color: var(--good); }
  .result.no { background: var(--bad-bg); color: var(--bad); }
  .result.ok { animation: pop 420ms cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* A burst of sparks thrown from the middle of the card on a correct pick. */
  .burst { position: fixed; pointer-events: none; z-index: 60; }
  .burst i {
    position: absolute; width: 11px; height: 11px; border-radius: 3px; margin: -5px 0 0 -5px;
    animation: spark 900ms cubic-bezier(.15, .75, .3, 1) forwards;
  }
  @keyframes spark {
    0%   { transform: translate(0, 0) scale(.3) rotate(0deg); opacity: 1; }
    65%  { opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 34px)) scale(1) rotate(260deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result.ok { animation: none; }
    .burst { display: none; }
  }
  /* On a short phone all four options still have to fit without scrolling. */
  @media (max-height: 660px) {
    .card.choosing { padding: 12px; }
    .card.choosing .art-slot { max-width: 124px; }
    /* Speaker buttons keep a 44px tap target, so the artwork yields the rest. */
    .card.choosing.with-speakers .art-slot { max-width: 84px; }
    /* Tighten the number gutter too, so long names wrap less often here. */
    button.choice:has(.n) { padding-left: 38px; padding-right: 38px; }
    button.choice .n { left: 8px; padding: 1px 6px; }
    button.choice { padding: 9px 10px; font-size: 15px; }
    .actions.choices { gap: 6px; }
  }

  /* ---- settings ---- */
  .sheet { display: none; }
  .sheet.open { display: block; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .group > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; flex-wrap: wrap; }
  .row + .row { border-top: 1px solid var(--line); }
  .row label { flex: 1; cursor: pointer; font-size: 14.5px; }
  .row label small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 400; }
  input[type=radio], input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--accent); flex: none; cursor: pointer; }
  select { font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); max-width: 62%; }
  /* Type colours, darkened from the canonical palette until white text clears
     4.5:1 on every one of them. Same values in both themes. */
  .badge[data-t="Normal"]   { --tc: #777759; }
  .badge[data-t="Fire"]     { --tc: #bc560d; }
  .badge[data-t="Water"]    { --tc: #3f6fd8; }
  .badge[data-t="Electric"] { --tc: #8d7209; }
  .badge[data-t="Grass"]    { --tc: #418428; }
  .badge[data-t="Ice"]      { --tc: #367f7c; }
  .badge[data-t="Fighting"] { --tc: #b52a24; }
  .badge[data-t="Poison"]   { --tc: #8d3490; }
  .badge[data-t="Ground"]   { --tc: #937025; }
  .badge[data-t="Flying"]   { --tc: #7b61d4; }
  .badge[data-t="Psychic"]  { --tc: #d92c67; }
  .badge[data-t="Bug"]      { --tc: #6d7b0f; }
  .badge[data-t="Rock"]     { --tc: #847429; }
  .badge[data-t="Ghost"]    { --tc: #5f4a80; }
  .badge[data-t="Dragon"]   { --tc: #5c2ce0; }
  .badge[data-t="Dark"]     { --tc: #57443a; }
  .badge[data-t="Steel"]    { --tc: #6d6d87; }
  .badge[data-t="Fairy"]    { --tc: #b45287; }

  .type-badges { display: flex; gap: 6px; justify-content: center; margin-top: 9px; flex-wrap: wrap; }
  .badge {
    background: var(--tc); color: #fff; border-radius: 99px; padding: 3px 11px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  /* Same chip as a settings toggle: filled when on, quiet when off. */
  .types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .types .badge {
    background: var(--panel-2); color: var(--ink-3); border: 1px solid var(--line);
    padding: 9px 6px; text-align: center; cursor: pointer; font-size: 11px;
  }
  .types .badge:has(:checked) { background: var(--tc); color: #fff; border-color: var(--tc); }
  .types .badge:has(:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* Visually hidden but still focusable and announced by screen readers. */
  .types .badge input {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  .gens { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .gens label {
    display: flex; align-items: center; gap: 7px; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 13.5px;
    min-width: 0; flex-wrap: wrap;   /* the region name drops to its own line when narrow */
  }
  .gens label:has(:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--panel-2)); }
  .gens input { width: 16px; height: 16px; }
  .mini {
    appearance: none; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer;
  }
  .mini:hover { border-color: var(--ink-3); }
  .mini.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-bg); }
  .minis { display: flex; gap: 8px; flex-wrap: wrap; }
  .note { color: var(--ink-3); font-size: 12.5px; margin: 10px 0 0; }

  /* ---- summary / empty ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 14px 0 4px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 8px; }
  .stat b { display: block; font-size: 22px; font-weight: 700; }
  .stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
  .big-emoji { font-size: 44px; line-height: 1; }
  footer { text-align: center; color: var(--ink-3); font-size: 11.5px; margin-top: 14px; }
  kbd { font: inherit; font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
  @media (hover: none) { .kbd-hint { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Pokémon Name Trainer <span id="scopeLabel"></span></div>
    <button class="icon-btn" id="settingsBtn" aria-pressed="false" aria-label="Settings" title="Settings">⚙</button>
  </header>

  <div class="meter" id="meter" hidden>
    <span class="pill" id="countPill">0 / 0</span>
    <span class="bar"><i id="barFill" style="width:0%"></i></span>
    <span class="pill retry" id="retryPill" hidden>0 to retry</span>
  </div>

  <main id="study">
    <div class="card" id="card"><p class="hint">Loading the Pokédex…</p></div>
    <div class="actions" id="actions"></div>
  </main>

  <section class="sheet" id="settings" aria-label="Settings"></section>

  <footer>
    <span class="kbd-hint" id="kbdHint"></span>
  </footer>
</div>

<script type="module">
const STORE_KEY = 'pokemon-name-trainer/v1';

// Leitner-style intervals. Getting a card right moves it up a box and out of the
// pool until it comes due again; getting it wrong drops it back to the start.
const INTERVALS = [0, 4 * 3600e3, 24 * 3600e3, 3 * 864e5, 7 * 864e5, 21 * 864e5, 60 * 864e5];
const RETRY_GAP = 6;      // how many other cards to show before a missed card returns
const GEN_NAMES = ['', 'Kanto', 'Johto', 'Hoenn', 'Sinnoh', 'Unova', 'Kalos', 'Alola', 'Galar', 'Paldea'];

const DEFAULTS = {
  answerMode: 'flip',   // 'flip' = reveal and self-grade, 'choice' = pick one of four
  speakChoices: false,  // a speaker button beside each choice, for pre-readers
  easyChoices: false,   // decoys that sound different, rather than same-letter
  numberChoices: true,  // show 1-4 beside each answer
  fireworks: true,      // a burst of sparks on a correct pick
  order: 'family',
  keepFamilies: true,
  regionals: true,
  gens: [1, 2, 3, 4, 5, 6, 7, 8, 9],
  types: null,        // null means every type; an array is an explicit selection
  sessionSize: 40,
  showPhonetic: true,
  autoSpeak: false,
  voiceURI: '',
};

const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

// ---------------------------------------------------------------- persistence
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) ?? '{}');
    return {
      settings: { ...DEFAULTS, ...(saved.settings ?? {}) },
      progress: saved.progress ?? {},
    };
  } catch {
    return { settings: { ...DEFAULTS }, progress: {} };
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ settings, progress })); } catch {}
}

let { settings, progress } = load();
let DATA = null, CARDS = new Map(), GROUPS = new Map(), PHON = {};
let BY_NAME = new Map();
const REGION_WORDS = new Set(['Alolan', 'Galarian', 'Hisuian', 'Paldean']);

// ---------------------------------------------------------------------- speech
const speech = {
  voices: [], voice: null, busy: false,
  refresh() {
    if (!('speechSynthesis' in window)) return;
    this.voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith('en'));
    this.voice = this.voices.find((v) => v.voiceURI === settings.voiceURI)
      ?? this.voices.find((v) => v.localService && /en[-_]US/i.test(v.lang))
      ?? this.voices.find((v) => v.localService)
      ?? this.voices[0] ?? null;
  },
  say(text, onState) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; }
    u.rate = 0.86; u.pitch = 1;
    u.onstart = () => onState?.(true);
    u.onend = u.onerror = () => onState?.(false);
    speechSynthesis.speak(u);
  },
};
if ('speechSynthesis' in window) {
  speech.refresh();
  speechSynthesis.addEventListener('voiceschanged', () => { speech.refresh(); if (view === 'settings') renderSettings(); });
}

// Options are plain names, and a minted one like "Alolan Roserade" has no card,
// so the region prefix is split off and both halves respelled independently.
function phoneticForName(name) {
  const card = BY_NAME.get(name);
  if (card) return phoneticFor(card);
  const [first, ...rest] = name.split(' ');
  if (rest.length && REGION_WORDS.has(first)) {
    const base = rest.join(' ');
    return `${PHON[first] ?? first} ${PHON[base] ?? base}`;
  }
  return PHON[name] ?? name;
}

// A regional form is spoken as "<region adjective> <species>", both respelled.
function phoneticFor(card) {
  const base = PHON[card.base] ?? card.base;
  return card.region ? `${PHON[card.region] ?? card.region} ${base}` : base;
}

// ------------------------------------------------------------------- the deck
const activeTypes = () => settings.types ?? DATA.types;

function filteredCards() {
  const gens = new Set(settings.gens);
  const types = new Set(activeTypes());
  return DATA.cards.filter((c) => {
    if (!gens.has(c.gen)) return false;
    if (!settings.regionals && c.region) return false;
    // Types match per card, not per family: Steel keeps Galarian Meowth and
    // Perrserker while dropping the Normal-type Meowth they sit beside.
    if (!c.types.some((t) => types.has(t))) return false;
    return true;
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function orderedCards() {
  const pool = filteredCards();
  if (settings.order === 'dex') {
    return pool.slice().sort((a, b) => a.dex - b.dex || a.id - b.id);
  }
  if (settings.order === 'shuffle') {
    if (!settings.keepFamilies) return shuffle(pool);
    const byGroup = new Map();
    for (const c of pool) {
      if (!byGroup.has(c.group)) byGroup.set(c.group, []);
      byGroup.get(c.group).push(c);
    }
    return shuffle([...byGroup.values()]).flat();
  }
  return pool; // 'family' — already grouped and in evolution order
}

const isDue = (card, now = Date.now()) => !progress[card.id] || progress[card.id].due <= now;

// --------------------------------------------------------------- session state
let view = 'study';           // 'study' | 'settings'
let mcOptions = null;         // the four choices, when in multiple-choice mode
let mcPicked = null;          // which one was chosen
let queue = [];               // cards still to show this session
let current = null;
let flipped = false;
let sessionTotal = 0, gotRight = 0, gotWrong = 0;
let ignoreSchedule = false;   // set by "Study anyway" when nothing is due

function startSession({ all = false, onlyMissed = null } = {}) {
  ignoreSchedule = all;
  if (onlyMissed) {
    queue = onlyMissed.slice();
  } else {
    const now = Date.now();
    const eligible = orderedCards().filter((c) => all || isDue(c, now));
    const limit = settings.sessionSize;
    if (limit && eligible.length > limit) {
      // Round up past the limit so an evolution family isn't split mid-session.
      let end = limit;
      while (end < eligible.length && eligible[end].group === eligible[end - 1].group) end++;
      queue = eligible.slice(0, end);
    } else {
      queue = eligible;
    }
  }
  sessionTotal = queue.length;
  gotRight = 0; gotWrong = 0;
  missedThisSession = new Map();
  next();
}

let missedThisSession = new Map();

function next() {
  clearBursts();
  current = queue.shift() ?? null;
  flipped = false;
  mcPicked = null;
  mcOptions = current && settings.answerMode === 'choice' ? buildChoices(current) : null;
  render();
  if (queue[0]) new Image().src = artUrl(queue[0]);   // preload the next card
}

// Made-up names padding out letters the Pokédex barely covers. Only X falls
// short of four real names (Xatu, Xerneas, Xurkitree), so one invention does it.
// These can only ever appear as wrong answers — the correct one is always a real
// card — and they are used last, after every real candidate is exhausted.
const INVENTED = { X: ['Xerxies'] };

// Three decoys sharing the answer's first letter, which is what makes this hard:
// Machop, Machoke, Machamp, Magikarp rather than four unrelated names.
function buildChoices(card) {
  const realNames = new Set(DATA.cards.map((c) => c.name));
  const notAnswer = (n) => n !== card.name;

  if (settings.easyChoices) {
    // Gentle mode: decoys that sound as unlike the answer as possible. Every
    // option starts with a different letter, so a listener can tell them apart
    // by ear. Region still matches, or the odd one out would give itself away.
    const sameKind = (c) => (c.region ?? null) === (card.region ?? null);
    const names = (list) => shuffle(list.map((c) => c.name).filter(notAnswer));
    return assembleChoices(card, [
      names(filteredCards().filter(sameKind)),
      names(DATA.cards.filter(sameKind)),
      names(filteredCards()),
      names(DATA.cards),
    ], { distinctLetters: true });
  }

  if (card.region) {
    // A regional form is only a real test when the species names match too, so
    // Alolan Rattata runs against Alolan Raticate rather than Alolan Meowth.
    const letter = card.base[0].toUpperCase();
    const sameBase = (c) => c.base[0].toUpperCase() === letter;
    const real = DATA.cards.filter((c) => c.region === card.region && sameBase(c)).map((c) => c.name);
    // A region seldom has four forms sharing a letter, so the rest are minted
    // from species that letter does cover: Alolan Rapidash, Alolan Rhydon.
    const bases = DATA.cards.filter((c) => !c.region && sameBase(c));
    const mint = (list) => [...new Set(list.map((c) => `${card.region} ${c.base}`))].filter((n) => !realNames.has(n));
    // Prefer species that could plausibly have such a form — no legendaries, and
    // nothing postdating the region — so a decoy isn't a giveaway.
    const plausible = bases.filter((c) => !c.legend && c.gen <= card.gen);
    return assembleChoices(card,
      [real, mint(plausible), mint(bases)].map((t) => shuffle(t.filter(notAnswer))));
  }

  const letter = card.name[0].toUpperCase();
  const sameLetter = (c) => c.name[0].toUpperCase() === letter;
  const plain = (c) => !c.region;
  const names = (list) => shuffle(list.map((c) => c.name).filter(notAnswer));
  return assembleChoices(card, [
    names(filteredCards().filter((c) => sameLetter(c) && plain(c))),
    names(DATA.cards.filter((c) => sameLetter(c) && plain(c))),
    shuffle((INVENTED[letter] ?? []).filter(notAnswer)),
    names(DATA.cards.filter(sameLetter)),
    names(DATA.cards),
  ]);
}

// "Alolan Rattata" is an R name, not an A name: when every option carries the
// same region prefix it tells you nothing, so the species letter is the one
// that matters — for telling options apart and for matching them.
function speciesLetter(name) {
  const [first, ...rest] = name.split(' ');
  return (rest.length && REGION_WORDS.has(first) ? rest.join(' ') : name)[0].toUpperCase();
}

// Takes the first three usable names, tier by tier, then shuffles the answer in.
// With distinctLetters the four options must all start with different letters;
// a small deck can starve that, so a second pass drops the rule to fill up.
function assembleChoices(card, tiers, { distinctLetters = false } = {}) {
  const picked = [];
  const seen = new Set([card.name]);
  const letters = new Set([speciesLetter(card.name)]);
  const walk = (enforceLetters) => {
    for (const tier of tiers) {
      for (const name of tier) {
        if (picked.length === 3) return;
        if (seen.has(name)) continue;
        if (enforceLetters && letters.has(speciesLetter(name))) continue;
        seen.add(name);
        letters.add(speciesLetter(name));
        picked.push(name);
      }
    }
  };
  walk(distinctLetters);
  if (picked.length < 3) walk(false);
  return shuffle([card.name, ...picked]);
}

const SPARK_COLOURS = ['#ffd93b', '#ff6b6b', '#4ecdc4', '#7c83ff', '#95e06c', '#ff9f43'];

// Thrown from the middle of the card, and cleaned up after itself. Skipped when
// the viewer asks for reduced motion, which the stylesheet also honours.
// Sparks outlive their card by a second, so anything still in flight is cleared
// on the way out — otherwise a fast player sees the last card's celebration
// hanging over the next one, including over an answer they got wrong.
function clearBursts() {
  for (const burst of document.querySelectorAll('.burst')) burst.remove();
}

function celebrate() {
  if (!settings.fireworks) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  clearBursts();
  const box = $('#card').getBoundingClientRect();
  const burst = el('div', { className: 'burst' });
  burst.style.left = `${box.left + box.width / 2}px`;
  burst.style.top = `${box.top + box.height / 2}px`;
  const count = 20;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
    const reach = 75 + Math.random() * 85;
    const spark = el('i');
    spark.style.setProperty('--dx', `${Math.cos(angle) * reach}px`);
    spark.style.setProperty('--dy', `${Math.sin(angle) * reach}px`);
    spark.style.background = SPARK_COLOURS[i % SPARK_COLOURS.length];
    spark.style.animationDelay = `${Math.random() * 90}ms`;
    burst.append(spark);
  }
  document.body.append(burst);
  setTimeout(() => burst.remove(), 1300);
}

function choose(option) {
  if (mcPicked) return;                       // ignore double taps
  mcPicked = option;
  const correct = option === current.name;
  applyGrade(correct);
  flipped = true;
  render();
  if (correct) celebrate();
}

function grade(right) { applyGrade(right); next(); }

function applyGrade(right) {
  const rec = progress[current.id] ?? { box: 0, seen: 0, wrong: 0 };
  rec.seen++;
  if (right) {
    gotRight++;
    rec.box = Math.min(rec.box + 1, INTERVALS.length - 1);
    rec.due = Date.now() + INTERVALS[rec.box];
  } else {
    gotWrong++;
    rec.wrong++;
    rec.box = 0;
    rec.due = 0;
    missedThisSession.set(current.id, current);
    // Back into the pool a handful of cards from now, so it comes round again.
    queue.splice(Math.min(RETRY_GAP, queue.length), 0, current);
  }
  progress[current.id] = rec;
  save();
}

// ------------------------------------------------------------------ rendering
const artUrl = (card) => `${DATA.spriteBase}/other/official-artwork/${card.id}.png`;

const BALL_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="7">'
  + '<circle cx="50" cy="50" r="44"/><path d="M6 50h88"/><circle cx="50" cy="50" r="13" fill="var(--panel)"/></svg>';

function makeArt(card) {
  const slot = el('div', { className: 'art-slot loading' });
  slot.innerHTML = BALL_SVG;
  const img = el('img', { className: 'art', src: artUrl(card), alt: '', decoding: 'async', fetchPriority: 'high' });
  img.onload = () => { slot.classList.remove('loading'); img.classList.add('ready'); };
  // Official artwork is missing for a handful of forms; fall back to the pixel
  // sprite, and if that fails too the Poké Ball placeholder just stays put.
  img.onerror = () => {
    img.onerror = () => slot.classList.remove('loading');
    img.src = `${DATA.spriteBase}/${card.id}.png`;
  };
  slot.append(img);
  return slot;
}

// data-t drives the colour; the same badge doubles as the settings filter chip.
function typeBadge(type, input) {
  const node = el(input ? 'label' : 'span', { className: 'badge' }, input ? [input, type] : [type]);
  node.setAttribute('data-t', type);
  return node;
}

function speakButton(card) {
  const supported = 'speechSynthesis' in window;
  const btn = el('button', {
    className: 'speak', type: 'button', disabled: !supported,
    title: supported ? 'Hear the name (P)' : 'This browser has no speech support',
  }, [supported ? '🔊 Pronounce' : '🔇 No speech support']);
  btn.onclick = () => speech.say(phoneticFor(card), (on) => btn.classList.toggle('speaking', on));
  return btn;
}

function renderCard() {
  const card = $('#card');
  const actions = $('#actions');
  card.textContent = ''; actions.textContent = '';
  card.className = 'card ' + (flipped ? 'back' : 'front');

  if (!flipped) {
    const choosing = settings.answerMode === 'choice';
    card.append(makeArt(current), el('p', { className: 'hint' }, choosing ? 'Which one is this?' : 'Who is this?'));
    if (choosing) {
      card.classList.add('choosing');
      card.classList.toggle('with-speakers', settings.speakChoices);
      card.classList.toggle('roomy', settings.easyChoices);
      actions.className = `actions choices${settings.easyChoices ? ' roomy' : ''}`;
      const canSpeak = 'speechSynthesis' in window;
      for (const [i, opt] of mcOptions.entries()) {
        const btn = el('button', { className: 'big choice', type: 'button' },
          settings.numberChoices
            ? [el('span', { className: 'n' }, String(i + 1)), el('span', {}, opt)]
            : [el('span', {}, opt)]);
        btn.onclick = () => choose(opt);
        if (!settings.speakChoices) { actions.append(btn); continue; }
        const say = el('button', {
          className: 'speak-choice', type: 'button', disabled: !canSpeak,
          ariaLabel: `Hear ${opt}`, title: `Hear ${opt}`,
        }, '\u{1F50A}');
        say.onclick = () => speech.say(phoneticForName(opt), (on) => say.classList.toggle('speaking', on));
        actions.append(el('div', { className: 'choice-row' }, [btn, say]));
      }
      return;
    }
    const guess = el('button', { className: 'big primary', type: 'button' },
      [el('span', {}, 'Guess'), el('small', {}, 'reveal the name')]);
    guess.onclick = flip;
    actions.className = 'actions';
    actions.append(guess);
    return;
  }

  const group = GROUPS.get(current.group);
  const pos = group.members.indexOf(current.id) + 1;
  const facts = el('div', { className: 'facts' }, [
    el('span', {}, [el('b', {}, `#${String(current.dex).padStart(4, '0')}`)]),
    el('span', {}, '·'),
    el('span', {}, `Gen ${current.gen} ${GEN_NAMES[current.gen]}`),
    el('span', {}, '·'),
    el('span', {}, group.members.length > 1 ? `${group.name} family, ${pos} of ${group.members.length}` : 'no evolutions'),
  ]);

  const say = el('div', { className: 'say' }, [speakButton(current)]);
  const badges = el('div', { className: 'type-badges' }, current.types.map((t) => typeBadge(t)));
  card.append(makeArt(current), el('h1', { className: 'name' }, current.name), badges, say, facts);
  if (settings.showPhonetic) say.prepend(el('span', { className: 'phon' }, phoneticFor(current)));

  if (mcPicked) {
    // The choice already graded it, so the back just reports and moves on.
    const correct = mcPicked === current.name;
    card.prepend(el('div', { className: `result ${correct ? 'ok' : 'no'}` },
      correct ? '\u2713 Correct' : `\u2717 You picked ${mcPicked}`));
    const onward = el('button', { className: 'big primary', type: 'button' },
      [el('span', {}, 'Next'), el('small', {}, queue.length ? `${queue.length} to go` : 'last one')]);
    onward.onclick = () => next();
    actions.className = 'actions';
    actions.append(onward);
  } else {
    const wrong = el('button', { className: 'big bad', type: 'button' },
      [el('span', {}, '✗ Missed it'), el('small', {}, 'retry soon')]);
    const right = el('button', { className: 'big good', type: 'button' },
      [el('span', {}, '✓ Got it'), el('small', {}, 'rest for a while')]);
    wrong.onclick = () => grade(false);
    right.onclick = () => grade(true);
    actions.className = 'actions two';
    actions.append(wrong, right);
  }

  if (settings.autoSpeak) say.querySelector('.speak')?.click();
}

function flip() {
  if (!current || flipped) return;
  flipped = true;
  renderCard();
}

function renderDone() {
  const card = $('#card');
  const actions = $('#actions');
  card.textContent = ''; actions.textContent = ''; card.className = 'card';

  const missed = [...missedThisSession.values()];
  const total = gotRight + gotWrong;
  const pct = total ? Math.round((gotRight / total) * 100) : 0;

  card.append(
    el('div', { className: 'big-emoji' }, sessionTotal === 0 ? '🌙' : pct >= 80 ? '🏆' : '💪'),
    el('h1', { className: 'name', style: 'font-size:26px;margin-top:10px' },
      sessionTotal === 0 ? 'Nothing due right now' : 'Session complete'),
  );

  if (sessionTotal === 0) {
    const now = Date.now();
    const pool = filteredCards();
    const nextDue = pool.map((c) => progress[c.id]?.due ?? 0).filter((d) => d > now).sort((a, b) => a - b)[0];
    card.append(el('p', { className: 'hint' }, pool.length === 0
      ? 'No Pokémon match your current filters — widen the generations or types in settings.'
      : nextDue ? `You're on top of all ${pool.length}. The next one is due ${relative(nextDue - now)}.`
        : 'Adjust your filters or study anyway.'));
  } else {
    card.append(el('div', { className: 'stat-grid' }, [
      el('div', { className: 'stat' }, [el('b', { style: 'color:var(--good)' }, String(gotRight)), el('span', {}, 'right')]),
      el('div', { className: 'stat' }, [el('b', { style: 'color:var(--bad)' }, String(gotWrong)), el('span', {}, 'missed')]),
      el('div', { className: 'stat' }, [el('b', {}, `${pct}%`), el('span', {}, 'first try')]),
    ]));
    if (missed.length) {
      card.append(el('p', { className: 'hint' },
        `Tripped you up: ${missed.slice(0, 6).map((c) => c.name).join(', ')}${missed.length > 6 ? `, +${missed.length - 6} more` : ''}`));
    }
  }

  actions.className = 'actions';
  const again = el('button', { className: 'big primary', type: 'button' },
    [el('span', {}, sessionTotal === 0 ? 'Study anyway' : 'Next session'), el('small', {}, sessionTotal === 0 ? 'ignore the schedule' : 'whatever is due now')]);
  again.onclick = () => startSession({ all: sessionTotal === 0 });
  actions.append(again);
  if (missed.length) {
    const drill = el('button', { className: 'big', type: 'button' },
      [el('span', {}, `Drill the ${missed.length} I missed`), el('small', {}, 'straight back through them')]);
    drill.onclick = () => startSession({ onlyMissed: missed });
    actions.append(drill);
  }
}

function relative(ms) {
  const h = ms / 3600e3;
  if (h < 1) return `in ${Math.max(1, Math.round(ms / 60e3))} min`;
  if (h < 24) return `in ${Math.round(h)} h`;
  return `in ${Math.round(h / 24)} day${Math.round(h / 24) === 1 ? '' : 's'}`;
}

function render() {
  $('#settings').classList.toggle('open', view === 'settings');
  $('#study').hidden = view === 'settings';
  $('#settingsBtn').setAttribute('aria-pressed', String(view === 'settings'));

  const pool = filteredCards();
  const known = pool.filter((c) => (progress[c.id]?.box ?? 0) > 0).length;
  $('#scopeLabel').textContent = `· ${known}/${pool.length} learned`;

  if (view === 'settings') { $('#meter').hidden = true; return; }

  const showMeter = !!current;
  $('#meter').hidden = !showMeter;
  if (showMeter) {
    // A card only leaves the session once it is answered right, so counting
    // those keeps the bar moving forwards even when misses get re-queued.
    $('#countPill').textContent = `${gotRight} / ${sessionTotal}`;
    $('#barFill').style.width = `${(gotRight / Math.max(1, sessionTotal)) * 100}%`;
    const retry = missedThisSession.size ? queue.filter((c) => missedThisSession.has(c.id)).length : 0;
    $('#retryPill').hidden = retry === 0;
    $('#retryPill').textContent = `${retry} to retry`;
  }

  $('#kbdHint').innerHTML = settings.answerMode === 'choice'
    ? '<kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Space</kbd> next · <kbd>P</kbd> pronounce'
    : '<kbd>Space</kbd> flip · <kbd>←</kbd> missed · <kbd>→</kbd> got it · <kbd>P</kbd> pronounce';
  if (current) renderCard(); else renderDone();
}

// ------------------------------------------------------------------- settings
function renderSettings() {
  const wrap = $('#settings');
  wrap.textContent = '';

  const radio = (value, label, sub) => {
    const input = el('input', { type: 'radio', name: 'order', value, checked: settings.order === value, id: `o-${value}` });
    input.onchange = () => { settings.order = value; save(); renderSettings(); startSession(); };
    return el('div', { className: 'row' }, [input,
      el('label', { htmlFor: `o-${value}` }, [label, el('small', {}, sub)])]);
  };
  const toggle = (key, label, sub, onChange) => {
    const id = `t-${key}`;
    const input = el('input', { type: 'checkbox', checked: settings[key], id });
    input.onchange = () => { settings[key] = input.checked; save(); onChange?.(); };
    return el('div', { className: 'row' }, [input, el('label', { htmlFor: id }, [label, el('small', {}, sub)])]);
  };

  // Order
  const order = el('div', { className: 'group' }, [el('h2', {}, 'Card order')]);
  order.append(
    radio('family', 'Evolution families', 'Meowth → Galarian Meowth → Persian → Perrserker, families in Pokédex order'),
    radio('dex', 'Pokédex number', 'Strict #0001 upward; regional forms follow their base number'),
    radio('shuffle', 'Shuffled', 'Random order, reshuffled every session'),
  );
  if (settings.order === 'shuffle') {
    order.append(toggle('keepFamilies', 'Keep families together', 'Shuffle whole families instead of individual cards', () => startSession()));
  }
  wrap.append(order);

  // Answer mode
  const mode = el('div', { className: 'group' }, [el('h2', {}, 'How to answer')]);
  for (const [value, label, sub] of [
    ['flip', 'Reveal and self-grade', 'Flip the card, then mark yourself right or wrong'],
    ['choice', 'Multiple choice', 'Pick from four names that all start with the same letter'],
  ]) {
    const input = el('input', { type: 'radio', name: 'answerMode', value, checked: settings.answerMode === value, id: `m-${value}` });
    input.onchange = () => { settings.answerMode = value; save(); renderSettings(); startSession(); };
    mode.append(el('div', { className: 'row' }, [input, el('label', { htmlFor: `m-${value}` }, [label, el('small', {}, sub)])]));
  }
  if (settings.answerMode === 'choice') {
    mode.append(toggle('speakChoices', 'Speaker on every choice',
      'Adds a \u{1F50A} button beside each answer so it can be heard \u2014 for anyone who cannot read yet',
      () => render()));
    mode.append(toggle('easyChoices', 'Easier choices',
      'Decoys that sound clearly different, instead of four names starting with the same letter',
      () => startSession()));
    mode.append(toggle('numberChoices', 'Number the choices',
      'Shows 1\u20134 beside each answer', () => render()));
    mode.append(toggle('fireworks', 'Fireworks when you are right',
      'A burst of sparks over the card on a correct pick'));
  }
  wrap.append(mode);

  // What to include
  const scope = el('div', { className: 'group' }, [el('h2', {}, 'What to include')]);
  const gens = el('div', { className: 'gens' });
  for (let g = 1; g <= 9; g++) {
    const count = DATA.cards.filter((c) => c.gen === g).length;
    const input = el('input', { type: 'checkbox', checked: settings.gens.includes(g) });
    input.onchange = () => {
      settings.gens = input.checked ? [...settings.gens, g].sort((a, b) => a - b) : settings.gens.filter((x) => x !== g);
      save(); renderSettings(); startSession();
    };
    gens.append(el('label', { title: `${count} cards` }, [input, `Gen ${g}`, el('small', { style: 'color:var(--ink-3)' }, ` ${GEN_NAMES[g]}`)]));
  }
  const all = el('button', { className: 'mini', type: 'button', ariaLabel: 'Select all generations' }, 'All');
  const none = el('button', { className: 'mini', type: 'button', ariaLabel: 'Clear all generations' }, 'None');
  all.onclick = () => { settings.gens = [1,2,3,4,5,6,7,8,9]; save(); renderSettings(); startSession(); };
  none.onclick = () => { settings.gens = []; save(); renderSettings(); startSession(); };
  scope.append(gens, el('p', { className: 'note' },
    'Each Pok\u00e9mon sits in the generation that introduced it, so Alolan Meowth is Gen 7 and Perrserker is Gen 8 even though Meowth is Gen 1. Evolution families stay grouped in the running order either way.'),
    el('div', { className: 'minis', style: 'margin-top:10px' }, [all, none]),
    toggle('regionals', 'Regional forms',
      `Alolan, Galarian, Hisuian and Paldean variants (${DATA.cards.filter((c) => c.region).length} extra cards)`,
      () => { renderSettings(); startSession(); }));

  const types = el('div', { className: 'types' });
  for (const t of DATA.types) {
    const on = activeTypes().includes(t);
    const input = el('input', { type: 'checkbox', checked: on });
    input.onchange = () => {
      settings.types = input.checked ? [...activeTypes(), t] : activeTypes().filter((x) => x !== t);
      if (settings.types.length === DATA.types.length) settings.types = null;
      save(); renderSettings(); startSession();
    };
    types.append(typeBadge(t, input));
  }
  const allT = el('button', { className: 'mini', type: 'button', ariaLabel: 'Select all types' }, 'All');
  const noneT = el('button', { className: 'mini', type: 'button', ariaLabel: 'Clear all types' }, 'None');
  allT.onclick = () => { settings.types = null; save(); renderSettings(); startSession(); };
  noneT.onclick = () => { settings.types = []; save(); renderSettings(); startSession(); };
  scope.append(el('h2', { style: 'margin:18px 0 10px' }, 'Types'), types,
    el('p', { className: 'note' },
      'Like generations, types match individual Pok\u00e9mon: Steel keeps Galarian Meowth and Perrserker but not the Normal-type Meowth beside them.'),
    el('div', { className: 'minis', style: 'margin-top:10px' }, [allT, noneT]));

  const sizeSel = el('select');
  for (const [v, label] of [[20, '20 cards'], [40, '40 cards'], [80, '80 cards'], [0, 'No limit']]) {
    sizeSel.append(el('option', { value: String(v), selected: settings.sessionSize === v }, label));
  }
  sizeSel.onchange = () => { settings.sessionSize = +sizeSel.value; save(); startSession(); };
  scope.append(el('div', { className: 'row' }, [
    el('label', {}, ['Session length', el('small', {}, 'Rounded up so a family finishes together')]), sizeSel]));
  wrap.append(scope);

  // Pronunciation
  const audio = el('div', { className: 'group' }, [el('h2', {}, 'Pronunciation')]);
  audio.append(
    toggle('showPhonetic', 'Show the phonetic spelling', 'e.g. Rayquaza — ray-KWAH-zuh'),
    toggle('autoSpeak', 'Speak the name automatically', 'Plays as soon as you flip the card'),
  );
  if ('speechSynthesis' in window) {
    const voiceSel = el('select');
    voiceSel.append(el('option', { value: '' }, 'Automatic'));
    for (const v of speech.voices) {
      voiceSel.append(el('option', { value: v.voiceURI, selected: settings.voiceURI === v.voiceURI }, `${v.name} (${v.lang})`));
    }
    voiceSel.onchange = () => {
      settings.voiceURI = voiceSel.value; save(); speech.refresh();
      speech.say(phoneticFor(current ?? CARDS.get(384) ?? DATA.cards[0]));
    };
    audio.append(el('div', { className: 'row' }, [
      el('label', {}, ['Voice', el('small', {}, speech.voices.length ? 'Picking one plays a sample' : 'No English voices found in this browser')]),
      voiceSel]));
  } else {
    audio.append(el('p', { className: 'note' }, 'This browser does not support speech synthesis, so the pronounce button is disabled.'));
  }
  wrap.append(audio);

  // Progress
  const pool = filteredCards();
  const learned = pool.filter((c) => (progress[c.id]?.box ?? 0) > 0);
  const mature = pool.filter((c) => (progress[c.id]?.box ?? 0) >= 4);
  const prog = el('div', { className: 'group' }, [el('h2', {}, 'Progress')]);
  prog.append(el('div', { className: 'stat-grid', style: 'margin-top:0' }, [
    el('div', { className: 'stat' }, [el('b', {}, String(learned.length)), el('span', {}, 'started')]),
    el('div', { className: 'stat' }, [el('b', {}, String(mature.length)), el('span', {}, 'solid')]),
    el('div', { className: 'stat' }, [el('b', {}, String(pool.filter((c) => isDue(c)).length)), el('span', {}, 'due now')]),
  ]));
  const reset = el('button', { className: 'mini danger', type: 'button' }, 'Reset all progress');
  reset.onclick = () => {
    if (!confirm(`Forget everything you've learned across all ${Object.keys(progress).length} Pokémon? This cannot be undone.`)) return;
    progress = {}; save(); renderSettings(); startSession();
  };
  prog.append(el('div', { className: 'minis', style: 'margin-top:12px' }, [reset]),
    el('p', { className: 'note' }, 'Progress lives in this browser only — it is not synced anywhere.'));
  wrap.append(prog);

  const close = el('button', { className: 'big primary', type: 'button' }, 'Back to studying');
  close.onclick = () => { view = 'study'; render(); };
  wrap.append(close);
}

$('#settingsBtn').onclick = () => {
  view = view === 'settings' ? 'study' : 'settings';
  if (view === 'settings') renderSettings();
  render();
};

// ------------------------------------------------------------------- keyboard
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches('input, select, textarea')) return;
  const key = e.key.toLowerCase();
  if (key === 'escape' && view === 'settings') { view = 'study'; render(); return; }
  if (view !== 'study' || !current) return;
  if (!flipped) {
    if (mcOptions) {
      const n = Number(e.key);
      if (n >= 1 && n <= mcOptions.length) { e.preventDefault(); choose(mcOptions[n - 1]); }
      return;
    }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    return;
  }
  if (key === 'p') { e.preventDefault(); document.querySelector('.speak:not([disabled])')?.click(); return; }
  if (mcPicked) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
    return;
  }
  if (e.key === 'ArrowLeft' || key === 'j' || e.key === '1') { e.preventDefault(); grade(false); }
  else if (e.key === 'ArrowRight' || key === 'k' || e.key === '2') { e.preventDefault(); grade(true); }
  else if (e.key === ' ') e.preventDefault();   // no accidental grading on the back
});

// ----------------------------------------------------------------------- boot
try {
  const [pokemon, pron] = await Promise.all([
    fetch('data/pokemon.json').then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    fetch('data/pronunciations.json').then((r) => r.ok ? r.json() : {}),
  ]);
  DATA = pokemon; PHON = pron;
  for (const c of DATA.cards) { CARDS.set(c.id, c); BY_NAME.set(c.name, c); }
  for (const g of DATA.groups) GROUPS.set(g.id, g);
  startSession();
} catch (err) {
  $('#card').textContent = '';
  $('#card').append(
    el('div', { className: 'big-emoji' }, '📕'),
    el('h1', { className: 'name', style: 'font-size:22px' }, "Couldn't load the Pokédex"),
    el('p', { className: 'hint' }, `${err.message}. Browsers block local file reads, so serve the folder over HTTP — for example “python3 -m http.server” in this directory, then open http://localhost:8000.`),
  );
}
</script>
</body>
</html>
